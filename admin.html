<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FindDrive — Адмін</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a7a4a;--green-dark:#0d4a2a;--green-light:#e8f4ee;
  --bg:#f0f2f0;--white:#fff;--text:#0d2a1a;--text-muted:#5a7a6a;--text-hint:#7a9a8a;
  --border:#dde8dd;--pink:#993556;--pink-light:#fbeaf0;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

/* NAV */
.nav{background:var(--white);border-bottom:.5px solid var(--border);padding:0 40px;height:56px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.nav-title{font-size:14px;font-weight:600;color:var(--text)}
.nav-badge{font-size:11px;background:#fff3cd;color:#856404;border-radius:5px;padding:2px 8px;font-weight:500}
.btn-signout{font-size:13px;color:var(--text-muted);background:none;border:.5px solid var(--border);border-radius:8px;padding:7px 14px;cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s}
.btn-signout:hover{border-color:#cc3333;color:#cc3333}

/* AUTH GATE */
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;text-align:center;padding:24px}
.gate-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:8px}
.gate h2{font-size:20px;font-weight:600}
.gate p{font-size:14px;color:var(--text-muted)}
.btn-google{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 24px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:box-shadow .2s}
.btn-google:hover{box-shadow:0 2px 12px rgba(0,0,0,.1)}
.btn-google svg{width:20px;height:20px;flex-shrink:0}

/* ADMIN PANEL */
.wrap{max-width:860px;margin:0 auto;padding:32px 24px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:600}
.count-badge{background:var(--pink-light);color:var(--pink);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:500}
.empty{text-align:center;padding:60px 24px;color:var(--text-hint);font-size:14px}
.denied{text-align:center;padding:60px 24px}
.denied h3{font-size:16px;font-weight:600;margin-bottom:8px}
.denied p{font-size:13px;color:var(--text-muted);margin-bottom:16px}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:.5px solid var(--border);flex-wrap:wrap}
.tab-btn{background:none;border:none;padding:10px 4px;margin-right:20px;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
.tab-btn .count-badge{margin-left:6px}

/* FUNNEL */
.funnel-range{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.funnel-range-btn{background:var(--bg);border:none;border-radius:20px;padding:7px 16px;font-size:12.5px;font-weight:500;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s}
.funnel-range-btn.active{background:var(--green);color:#fff}
.funnel-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.funnel-stat{background:var(--white);border:.5px solid var(--border);border-radius:14px;padding:16px}
.funnel-stat b{display:block;font-size:26px;color:var(--text);font-weight:700}
.funnel-stat span{font-size:12px;color:var(--text-muted)}
.funnel-stat.approved b{color:var(--green)}
.funnel-stat.rejected b{color:#cc3333}
.funnel-daily{background:var(--white);border:.5px solid var(--border);border-radius:14px;padding:16px}
.funnel-day-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.funnel-day-label{width:44px;font-size:11px;color:var(--text-muted);flex-shrink:0}
.funnel-day-bar-wrap{flex:1;background:var(--bg);border-radius:5px;overflow:hidden;height:16px}
.funnel-day-bar{height:100%;background:var(--green);border-radius:5px;min-width:2px}
.funnel-day-count{width:22px;text-align:right;font-size:11px;font-weight:600;color:var(--text);flex-shrink:0}

/* PROBLEM CARDS */
.problem-card{background:var(--white);border-radius:16px;border:.5px solid var(--border);padding:18px 20px;margin-bottom:12px}
.problem-card.resolved{opacity:.55}
.problem-text{font-size:14px;color:var(--text);line-height:1.55;margin-bottom:8px;white-space:pre-wrap}
.problem-meta{font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.problem-actions{display:flex;gap:8px}
.btn-approve{background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .2s;white-space:nowrap}
.btn-approve:hover{background:var(--green-dark)}
.btn-reject{background:none;border:.5px solid var(--border);border-radius:9px;padding:9px 16px;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s;white-space:nowrap}
.btn-reject:hover{border-color:#cc3333;color:#cc3333}

/* ADMIN CARDS (instructors / users / bookings) */
.admin-header{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-hint);font-weight:500;margin:16px 0 10px;display:flex;align-items:center;gap:7px}
.admin-header::before{content:'';flex:1;height:.5px;background:var(--border)}
.admin-badge-cnt{background:var(--pink);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:0}
.admin-card{background:var(--white);border:.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.admin-card-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s}
.admin-card-head:hover{background:var(--bg)}
.admin-card-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--green-light);color:var(--green)}
.admin-card-main{flex:1;min-width:0}
.admin-card-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-card-sub{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-status{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;flex-shrink:0}
.admin-status.pending{background:#fff3cd;color:#856404}
.admin-status.approved{background:var(--green-light);color:var(--green)}
.admin-status.rejected{background:#fde8e8;color:#8a2020}
.admin-card-arrow{font-size:14px;color:var(--text-hint);transition:transform .2s;flex-shrink:0}
.admin-card.open .admin-card-arrow{transform:rotate(180deg)}
.admin-card-body{display:none;padding:0 14px 14px;border-top:.5px solid var(--border)}
.admin-card.open .admin-card-body{display:block}
.admin-field{display:flex;gap:8px;font-size:12px;margin-top:9px;align-items:flex-start}
.admin-field-label{color:var(--text-muted);flex-shrink:0;width:90px;padding-top:1px}
.admin-field-val{color:var(--text);word-break:break-word;flex:1}
.admin-photos{display:flex;gap:10px;margin-top:12px}
.admin-photo{width:72px;height:72px;border-radius:10px;object-fit:cover;border:.5px solid var(--border);background:var(--bg)}
.admin-photo-label{font-size:10px;color:var(--text-muted);text-align:center;margin-top:3px}
.admin-actions{display:flex;gap:8px;margin-top:14px}
.admin-btn{flex:1;padding:8px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s}
.admin-btn:hover{opacity:.8}
.admin-btn.approve{background:var(--green);color:#fff}
.admin-btn.reject{background:#fde8e8;color:#8a2020;border:.5px solid #e0a8a8}
.admin-btn.delete{background:#fde8e8;color:#8a2020;border:.5px solid #e0a8a8;flex:0;white-space:nowrap}
.admin-tag{display:inline-flex;align-items:center;border-radius:20px;border:.5px solid;font-size:10px;padding:2px 8px;margin:2px 2px 0 0}
.admin-mp-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.admin-mp-del{flex-shrink:0;width:16px;height:16px;border-radius:50%;border:.5px solid #e0a8a8;background:#fde8e8;color:#8a2020;font-size:10px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.admin-mp-del:hover{opacity:.75}
.admin-mp-toggle{margin-top:6px;font-size:11px;color:var(--green);background:none;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:0;font-family:inherit}
.admin-mp-toggle:hover{text-decoration:underline}
.admin-mp-add{margin-top:8px;padding:10px;background:var(--green-light);border:.5px solid var(--border);border-radius:10px}
.admin-mp-add input{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;border:.5px solid var(--border);font-size:12px;font-family:inherit;margin-bottom:6px;background:var(--white)}
.admin-mp-suggests{list-style:none;margin:-4px 0 6px;padding:0;background:var(--white);border:.5px solid var(--border);border-radius:8px;max-height:140px;overflow-y:auto}
.admin-mp-suggests li{padding:6px 10px;font-size:11px;cursor:pointer;border-bottom:.5px solid var(--border)}
.admin-mp-suggests li:last-child{border-bottom:none}
.admin-mp-suggests li:hover{background:var(--white);color:var(--green)}
.admin-mp-map{width:100%;height:180px;border-radius:8px;overflow:hidden;margin-bottom:6px;border:.5px solid var(--border)}
.admin-mp-coords{font-size:10px;color:var(--text-hint);margin-bottom:6px}
.admin-mp-actions{display:flex;gap:8px}
.admin-edit-input{width:100%;box-sizing:border-box;padding:6px 9px;border-radius:7px;border:.5px solid var(--border);font-size:12px;font-family:inherit;background:var(--white);color:var(--text)}
textarea.admin-edit-input{resize:vertical;min-height:54px}
.admin-edit-btn{margin-top:4px;font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:0;font-family:inherit}
.admin-edit-btn:hover{text-decoration:underline}
.admin-sortbar{display:flex;align-items:center;gap:6px;padding:10px 14px 0;font-size:11px;color:var(--text-muted)}
.admin-sortbar select{padding:5px 8px;border-radius:7px;border:.5px solid var(--border);font-size:11px;font-family:inherit;background:var(--white);color:var(--text)}
.admin-modal-overlay{position:fixed;inset:0;background:rgba(13,42,26,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.admin-modal-box{background:var(--white);border:1px solid #000;border-radius:18px;width:100%;overflow:hidden}
.admin-msg-thread{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .15s}
.admin-msg-thread:hover{background:var(--green-light)}
.admin-msg-role{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;border-radius:6px;padding:2px 6px;flex-shrink:0}
.admin-msg-role.student{background:var(--green-light);color:var(--green)}
.admin-msg-role.instructor{background:#e6f1fb;color:var(--blue)}
.admin-msg-role.school{background:#fbeaf0;color:var(--pink)}
.admin-msg-unread{background:var(--pink);color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:1px 7px;flex-shrink:0}
.admin-chat-msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.4;word-break:break-word}
.admin-chat-msg.mine{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.admin-chat-msg.theirs{align-self:flex-start;background:var(--white);color:var(--text);border:.5px solid var(--border);border-bottom-left-radius:4px}
.admin-chat-msg-time{font-size:9px;opacity:.65;margin-top:3px}
.bk-status{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:500;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.bk-status.pending{background:#fff3cd;color:#856404}
.bk-status.confirmed{background:var(--green-light);color:var(--green)}
.bk-status.cancelled{background:var(--bg);color:var(--text-hint);border:.5px solid var(--border)}
.bk-status.reschedule_requested{background:#fff3cd;color:#856404}

/* TOAST */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--white);border:1px solid #000;border-radius:12px;padding:12px 14px;max-width:320px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;gap:10px;align-items:flex-start;pointer-events:auto;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.toast-title{font-size:13px;font-weight:600;color:var(--text)}
.toast-text{font-size:12px;color:var(--text-muted);margin-top:2px}
.toast-icon{color:var(--green);font-size:16px;flex-shrink:0}

@media(max-width:600px){.admin-field{flex-direction:column;gap:2px}.admin-field-label{width:auto}}

/* Кроп-редактор фото (портовано з index.html _showPhotoCrop, під дизайн-систему адмінки) */
.am-crop-overlay{position:fixed;inset:0;background:rgba(13,42,26,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
.am-crop-box{background:var(--white);border:1px solid #000;border-radius:18px;max-width:320px;width:100%;overflow:hidden}
.am-crop-head{background:var(--green);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px}
.am-crop-head button{background:rgba(255,255,255,.18);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.am-crop-body{padding:20px;text-align:center}
.am-crop-wrap{width:240px;height:240px;border-radius:50%;overflow:hidden;border:2px solid var(--green);margin:0 auto;box-shadow:0 4px 20px rgba(26,122,74,.2)}
.am-crop-zoom-row{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--text-muted)}
.am-crop-zoom-row input{flex:1;accent-color:var(--green)}
.am-crop-hint{font-size:11px;color:var(--text-hint);margin-bottom:18px}
.am-crop-actions{display:flex;gap:10px}
.am-crop-actions button{flex:1;padding:11px;border-radius:9px;font-family:inherit;font-size:14px;cursor:pointer}
.am-crop-actions button:first-child{border:.5px solid var(--border);background:transparent;color:var(--text)}
.am-crop-actions button:last-child{border:none;background:var(--green);color:#fff;font-weight:600}
</style>
</head>
<body>

<div id="toast-wrap"></div>

<input type="file" id="am-photo-file-input" accept="image/*" hidden>
<div id="am-crop-modal" class="am-crop-overlay" style="display:none" onclick="if(event.target===this)document.getElementById('am-crop-modal').style.display='none'">
  <div class="am-crop-box" id="am-crop-box">
    <div class="am-crop-head">
      <span><i class="ti ti-crop"></i> Налаштування фото</span>
      <button type="button" onclick="document.getElementById('am-crop-modal').style.display='none'" aria-label="Закрити"><i class="ti ti-x"></i></button>
    </div>
    <div class="am-crop-body">
      <div class="am-crop-wrap" id="am-crop-wrap"><canvas id="am-crop-canvas" width="240" height="240" style="cursor:grab;touch-action:none"></canvas></div>
      <div class="am-crop-zoom-row">
        <i class="ti ti-zoom-out"></i>
        <input type="range" id="am-crop-zoom" min="50" max="300" value="100">
        <i class="ti ti-zoom-in"></i>
      </div>
      <p class="am-crop-hint">Перетягніть або масштабуйте фото</p>
      <div class="am-crop-actions">
        <button type="button" onclick="document.getElementById('am-crop-modal').style.display='none'">Скасувати</button>
        <button type="button" id="am-crop-confirm-btn">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<nav class="nav">
  <a class="nav-logo" href="index.html">
    <img src="logo192.png" alt="FindDrive">
    <span class="nav-title">FindDrive</span>
  </a>
  <span class="nav-badge">Адмін-панель</span>
  <button id="btn-signout" class="btn-signout" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Вийти</button>
</nav>

<div id="auth-gate" class="gate">
  <img class="gate-logo" src="logo192.png" alt="">
  <h2>Вхід для адміністратора</h2>
  <p>Доступ тільки для авторизованого власника</p>
  <button id="btn-google-login" class="btn-google">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.6 33 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.9 29.3 5 24 5 12.4 5 3 14.4 3 26s9.4 21 21 21c11 0 20-8 20-21 0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 15.1l6.6 4.8C14.6 16.1 19 13 24 13c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.1 6.9 29.3 5 24 5c-7.7 0-14.4 4.4-17.7 10.1z"/><path fill="#4CAF50" d="M24 47c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.4 38.5 26.8 39.5 24 39.5c-5.2 0-9.6-3.6-11.2-8.5l-6.5 5C9.7 43 16.4 47 24 47z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l.1-.1 6.2 5.2c-.4.4 6.6-4.8 6.6-14.8 0-1.3-.1-2.6-.4-3.9z"/></svg>
    Увійти через Google
  </button>
</div>

<div id="admin-panel" style="display:none">
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tab-btn-instr" onclick="window._switchTab('instr')">Інструктори<span id="count-badge-instr" class="count-badge" style="display:none"></span></button>
      <button class="tab-btn" id="tab-btn-users" onclick="window._switchTab('users')">Учні</button>
      <button class="tab-btn" id="tab-btn-bookings" onclick="window._switchTab('bookings')">Записи</button>
      <button class="tab-btn" id="tab-btn-problems" onclick="window._switchTab('problems')">Проблеми<span id="count-badge-problems" class="count-badge" style="display:none"></span></button>
      <button class="tab-btn" id="tab-btn-schools" onclick="window._switchTab('schools')">Школи<span id="count-badge-schools" class="count-badge" style="display:none"></span></button>
      <button class="tab-btn" id="tab-btn-messages" onclick="window._switchTab('messages')">Повідомлення<span id="count-badge-messages" class="count-badge" style="display:none"></span></button>
      <button class="tab-btn" id="tab-btn-funnel" onclick="window._switchTab('funnel')">Воронка</button>
    </div>
    <div id="tab-funnel" style="display:none">
      <div class="page-head"><div class="page-title">Воронка інструкторів</div></div>
      <div class="funnel-range">
        <button class="funnel-range-btn active" onclick="window._funnelSetRange('all',this)">Весь час</button>
        <button class="funnel-range-btn" onclick="window._funnelSetRange('30d',this)">30 днів</button>
        <button class="funnel-range-btn" onclick="window._funnelSetRange('7d',this)">7 днів</button>
        <button class="funnel-range-btn" onclick="window._funnelSetRange('today',this)">Сьогодні</button>
      </div>
      <div id="funnel-stats"></div>
      <div id="funnel-daily"></div>
    </div>
    <div id="tab-instr">
      <div class="page-head"><div class="page-title">Інструктори</div></div>
      <div id="instr-list"></div>
    </div>
    <div id="tab-schools" style="display:none">
      <div class="page-head"><div class="page-title">Автошколи</div></div>
      <div id="schools-list"></div>
    </div>

function _showAdminPhotoCrop(file, onConfirm, opts) {
  const shape = (opts && opts.shape) || 'circle';
  const isRect = shape === 'rect';
  const CW = isRect ? 320 : 240, CH = isRect ? 240 : 240;
  const cx = CW / 2, cy = CH / 2;

  const modal = document.getElementById('am-crop-modal');
  const canvas = document.getElementById('am-crop-canvas');
  const wrap = document.getElementById('am-crop-wrap');
  const box = document.getElementById('am-crop-box');
  const previewRadius = shape === 'circle' ? '50%' : shape === 'square' ? '14px' : '9px';
  canvas.width = CW; canvas.height = CH;
  canvas.style.borderRadius = previewRadius;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  wrap.style.width = CW + 'px'; wrap.style.height = CH + 'px';
  wrap.style.borderRadius = previewRadius;
  box.style.maxWidth = isRect ? (CW + 48) + 'px' : '320px';

  const ctx = canvas.getContext('2d');
  const zoomSlider = document.getElementById('am-crop-zoom');
  const img = new Image();
  const url = URL.createObjectURL(file);
  let scale = 1, ox = 0, oy = 0, dragging = false, lastX = 0, lastY = 0;

  function draw() {
    ctx.clearRect(0, 0, CW, CH);
    ctx.drawImage(img, ox, oy, img.width * scale, img.height * scale);
  }

  img.onload = () => {
    URL.revokeObjectURL(url);
    const fitH = CH / img.height;
    const fitAll = Math.min(CW / img.width, CH / img.height);
    const minScale = Math.min(fitAll, fitH) * 0.5;
    scale = fitH;
    ox = (CW - img.width * scale) / 2;
    oy = (CH - img.height * scale) / 2;
    zoomSlider.min = Math.round(minScale * 100);
    zoomSlider.max = Math.round(fitH * 100 * 4);
    zoomSlider.value = Math.round(scale * 100);
    draw();
    modal.style.display = 'flex';
  };

  zoomSlider.oninput = (e) => {
    const newScale = e.target.value / 100;
    ox = cx - (cx - ox) * newScale / scale;
    oy = cy - (cy - oy) * newScale / scale;
    scale = newScale;
    draw();
  };

  function startDrag(x, y) { dragging = true; lastX = x; lastY = y; canvas.style.cursor = 'grabbing'; }
  function moveDrag(x, y) {
    if (!dragging) return;
    ox += x - lastX; oy += y - lastY; lastX = x; lastY = y; draw();
  }
  function endDrag() { dragging = false; canvas.style.cursor = 'grab'; }

  canvas.onmousedown  = (e) => startDrag(e.clientX, e.clientY);
  canvas.onmousemove  = (e) => moveDrag(e.clientX, e.clientY);
  canvas.onmouseup    = endDrag;
  canvas.onmouseleave = endDrag;
  canvas.ontouchstart = (e) => { e.preventDefault(); startDrag(e.touches[0].clientX, e.touches[0].clientY); };
  canvas.ontouchmove  = (e) => { e.preventDefault(); moveDrag(e.touches[0].clientX, e.touches[0].clientY); };
  canvas.ontouchend   = endDrag;

  document.getElementById('am-crop-confirm-btn').onclick = () => {
    const outW = isRect ? 400 : 200, outH = isRect ? 300 : 200;
    const out = document.createElement('canvas');
    out.width = outW; out.height = outH;
    const octx = out.getContext('2d');
    if (shape === 'circle') { octx.beginPath(); octx.arc(100, 100, 100, 0, Math.PI * 2); octx.clip(); }
    const rw = outW / CW, rh = outH / CH;
    octx.drawImage(img, ox * rw, oy * rh, img.width * scale * rw, img.height * scale * rh);
    modal.style.display = 'none';
    onConfirm(out.toDataURL('image/jpeg', 0.88));
  };

  img.src = url;
}

async function registerAdminFcm() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if (Notification.permission === 'default') {
    const p = await Notification.requestPermission();
    if (p !== 'granted') return;
  }
  if (Notification.permission !== 'granted') return;
  try {
    let reg = await navigator.serviceWorker.getRegistration('/firebase-messaging-sw.js').catch(() => null);
    if (!reg) reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(() => null);
    if (!reg) return;
    const { getMessaging, getToken } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js');
    const messaging = getMessaging(app);
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token && auth.currentUser) {
      await setDoc(doc(db, 'users', auth.currentUser.uid), { email: auth.currentUser.email, fcmToken: token }, { merge: true });
    }
  } catch (e) { console.warn('FCM token:', e.message); }
}

let _funnelAllInstr = [];
function renderFunnelTab(all) {
  _funnelAllInstr = all;
  const statsEl = document.getElementById('funnel-stats');
  const dailyEl = document.getElementById('funnel-daily');
  if (!statsEl || !dailyEl) return;

  const now = new Date();
  const cutoffs = {
    today: new Date(now.getFullYear(), now.getMonth(), now.getDate()),
    '7d':  new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000),
    '30d': new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000),
    all:   null,
  };
  const cutoff = cutoffs[_funnelRange];
  const filtered = all.filter(d => {
    const t = d.createdAt?.toDate?.();
    if (!t) return _funnelRange === 'all';
    return !cutoff || t >= cutoff;
  });

  const submitted = filtered.length;
  const approved  = filtered.filter(d => d.status === 'approved').length;
  const rejected  = filtered.filter(d => d.status === 'rejected').length;
  const pending   = filtered.filter(d => d.status === 'pending').length;
  const decided   = approved + rejected;
  const convPct   = decided ? Math.round(approved / decided * 100) : null;

  statsEl.innerHTML = `
    <div class="funnel-stats">
      <div class="funnel-stat"><b>${submitted}</b><span>подано анкет</span></div>
      <div class="funnel-stat"><b>${pending}</b><span>на розгляді</span></div>
      <div class="funnel-stat approved"><b>${approved}</b><span>підтверджено</span></div>
      <div class="funnel-stat rejected"><b>${rejected}</b><span>відхилено</span></div>
      <div class="funnel-stat"><b>${convPct === null ? '—' : convPct + '%'}</b><span>конверсія підтвердження</span></div>
    </div>`;

  const daysBack = _funnelRange === 'today' ? 1 : _funnelRange === '7d' ? 7 : 14;
  const byDay = {};
  filtered.forEach(d => {
    const t = d.createdAt?.toDate?.();
    if (!t) return;
    const key = t.toISOString().slice(0, 10);
    byDay[key] = (byDay[key] || 0) + 1;
  });
  const days = [];
  for (let i = daysBack - 1; i >= 0; i--) {
    days.push(new Date(now.getTime() - i * 24 * 60 * 60 * 1000).toISOString().slice(0, 10));
  }
  const maxCount = Math.max(1, ...days.map(k => byDay[k] || 0));
  dailyEl.innerHTML = submitted ? `
    <div class="funnel-daily">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;font-weight:600">Подані анкети по днях</div>
      ${days.map(k => {
        const cnt = byDay[k] || 0;
        const [, m, dd] = k.split('-');
        return `<div class="funnel-day-row">
          <div class="funnel-day-label">${dd}.${m}</div>
          <div class="funnel-day-bar-wrap"><div class="funnel-day-bar" style="width:${cnt / maxCount * 100}%"></div></div>
          <div class="funnel-day-count">${cnt}</div>
        </div>`;
      }).join('')}
    </div>` : '<div class="empty">Немає даних за обраний період</div>';
}

function renderInstrCard(instr) {
  const id = instr.id;
  const ini = initials(instr.name);
  const editing = _editingIds.instr.has(id);
  const statusCls = instr.status === 'approved' ? 'approved' : instr.status === 'rejected' ? 'rejected' : 'pending';

// ===== Пікер точки на мапі (пошук адреси + клік/перетягування) =====
// Спільний для "додати точку зустрічі інструктору" і "уточнити філію школи" —
// щоб адмін міг ТОЧНО поставити шпильку за адресою чи кліком, а не покладатись
// лише на сліпий пошук за назвою (той може влучити лише приблизно, в центр району).
const NOM_BASE = 'https://nominatim.openstreetmap.org/search?format=json&countrycodes=ua&accept-language=uk&bounded=0&addressdetails=1';
let _amOpenId = null, _amMap = null, _amMarker = null, _amLatLng = null, _amLeafletPromise = null, _amOnSave = null;
function _ensureAdminLeaflet() {
  if (_amLeafletPromise) return _amLeafletPromise;
  _amLeafletPromise = new Promise(resolve => {
    if (window.L) { resolve(window.L); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(link);
    const sc = document.createElement('script');
    sc.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    sc.onload = () => resolve(window.L);
    sc.onerror = () => { console.warn('Leaflet CDN недоступний'); resolve(null); };
    document.head.appendChild(sc);
  });
  return _amLeafletPromise;
}
function _amClose() {
  if (_amOpenId) { const el = document.getElementById(_amOpenId); if (el) el.innerHTML = ''; }
  _amOpenId = null; _amMap = null; _amMarker = null; _amLatLng = null; _amOnSave = null;
}
window._amClosePicker = (containerId) => { if (_amOpenId === containerId) _amClose(); };
// opts: {initialLabel, initialLat, initialLng, confirmLabel, onSave(label,lat,lng)}
function _amOpenPicker(containerId, opts) {
  if (_amOpenId === containerId) { _amClose(); return; }
  _amClose();
  const el = document.getElementById(containerId);
  if (!el) return;
  const { initialLabel = '', initialLat = null, initialLng = null, confirmLabel = 'Додати', onSave } = opts;
  _amOpenId = containerId;
  _amOnSave = onSave;
  if (initialLat != null && initialLng != null) _amLatLng = { lat: initialLat, lng: initialLng };
  el.innerHTML = `
    <div class="admin-mp-add" onclick="event.stopPropagation()">
      <input type="text" id="${containerId}-input" placeholder="Адреса…" maxlength="100" autocomplete="off" value="${esc(initialLabel)}"
        oninput="window._amAutoComplete('${containerId}', this.value)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();window._amHideSuggest('${containerId}');window._amSubmit('${containerId}')}"
        onblur="setTimeout(()=>window._amHideSuggest('${containerId}'),200)">
      <ul id="${containerId}-suggests" class="admin-mp-suggests" style="display:none"></ul>
      <div id="${containerId}-map" class="admin-mp-map"></div>
      <div id="${containerId}-coords" class="admin-mp-coords">${initialLat!=null?`${initialLat}, ${initialLng}`:'Натисніть на карту або оберіть адресу вище, щоб вибрати точку'}</div>
      <div class="admin-mp-actions">
        <button type="button" class="admin-btn approve" id="${containerId}-btn" onclick="window._amSubmit('${containerId}')"><i class="ti ti-check"></i> ${esc(confirmLabel)}</button>
        <button type="button" class="admin-btn reject" onclick="window._amClosePicker('${containerId}')"><i class="ti ti-x"></i> Скасувати</button>
      </div>
    </div>`;
  requestAnimationFrame(() => {
    _ensureAdminLeaflet().then(L => {
      if (!L || _amOpenId !== containerId) return;
      const startLL = initialLat != null ? [initialLat, initialLng] : [50.4501, 30.5234];
      _amMap = L.map(containerId + '-map', { zoomControl: true }).setView(startLL, initialLat != null ? 15 : 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(_amMap);
      if (initialLat != null) _amMarker = L.marker(startLL).addTo(_amMap);
      _amMap.on('click', e => {
        const { lat, lng } = e.latlng;
        _amLatLng = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
        if (_amMarker) _amMarker.setLatLng(e.latlng); else _amMarker = L.marker(e.latlng).addTo(_amMap);
        const coordEl = document.getElementById(containerId + '-coords');
        if (coordEl) coordEl.textContent = `${_amLatLng.lat}, ${_amLatLng.lng}`;
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=uk`)
          .then(r => r.json()).then(d => {
            const inp = document.getElementById(containerId + '-input');
            if (inp && d.display_name) inp.value = d.display_name.split(',').slice(0, 3).join(', ');
          }).catch(() => {});
      });
    });
  });
}
let _amAcTimer = null;
window._amHideSuggest = (containerId) => { const ul = document.getElementById(containerId + '-suggests'); if (ul) ul.style.display = 'none'; };
window._amAutoComplete = (containerId, q) => {
  clearTimeout(_amAcTimer);
  const ul = document.getElementById(containerId + '-suggests');
  if (!q || q.length < 2) { if (ul) ul.style.display = 'none'; return; }
  _amAcTimer = setTimeout(() => {
    fetch(`${NOM_BASE}&limit=5&q=${encodeURIComponent(q)}`)
      .then(r => r.json()).then(results => {
        const ul2 = document.getElementById(containerId + '-suggests');
        if (!ul2) return;
        if (!results.length) { ul2.style.display = 'none'; return; }
        ul2.innerHTML = results.map(r => {
          const short = r.display_name.split(',').slice(0, 3).join(', ');
          return `<li data-name="${esc(r.display_name)}" data-lat="${r.lat}" data-lon="${r.lon}" onmousedown="window._amSelectSuggest('${containerId}', this)">${esc(short)}</li>`;
        }).join('');
        ul2.style.display = '';
      }).catch(e => console.warn('am_autocomplete failed:', e.message));
  }, 200);
};
window._amSelectSuggest = (containerId, el) => {
  const name = el.dataset.name, lat = el.dataset.lat, lon = el.dataset.lon;
  const inp = document.getElementById(containerId + '-input');
  if (inp) inp.value = name.split(',').slice(0, 3).join(', ');
  window._amHideSuggest(containerId);
  _amLatLng = { lat: +parseFloat(lat).toFixed(6), lng: +parseFloat(lon).toFixed(6) };
  const place = () => {
    const ll = L.latLng(+parseFloat(lat), +parseFloat(lon));
    _amMap.setView(ll, 16);
    if (_amMarker) _amMarker.setLatLng(ll); else _amMarker = L.marker(ll).addTo(_amMap);
    const coordEl = document.getElementById(containerId + '-coords');
    if (coordEl) coordEl.textContent = `${_amLatLng.lat}, ${_amLatLng.lng}`;
  };
  if (_amMap) place(); else _ensureAdminLeaflet().then(() => { if (window.L && _amMap) place(); });
};
window._amSubmit = async (containerId) => {
  const inp = document.getElementById(containerId + '-input');
  const label = inp?.value.trim();
  if (!label) { alert('Вкажіть адресу/назву точки'); return; }
  const btn = document.getElementById(containerId + '-btn');
  if (!_amLatLng) {
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i>'; }
    try {
      const r = await fetch(`${NOM_BASE}&limit=1&q=${encodeURIComponent(label)}`);
      const results = await r.json();
      if (results.length) { const { lat, lon } = results[0]; _amLatLng = { lat: +parseFloat(lat).toFixed(6), lng: +parseFloat(lon).toFixed(6) }; }
    } catch (e) { console.warn('geocode failed:', e.message); }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-check"></i> Зберегти'; }
  }
  if (!_amLatLng) { alert('Адресу не знайдено — оберіть точку на карті'); return; }
  const onSave = _amOnSave;
  try {
    await onSave(label, _amLatLng.lat, _amLatLng.lng);
    _amClose();
  } catch (e) { alert('Помилка: ' + (e.message || e)); }
};

window._adminToggleAddPoint = (id) => {

let _schoolFirstSnap = true;

function _renderSchoolList() {

  const approved = _sortEntities(all.filter(i => i.status === 'approved'), mode, 'name');

  const badge = document.getElementById('count-badge-schools');

  else badge.style.display = 'none';

  const list = document.getElementById('schools-list');
  list.innerHTML = _sortBarHtml('school') + ([
    renderSchoolGroup('На розгляді', pending,  'pending'),
    renderSchoolGroup('Активні',      approved, 'approved'),
    renderSchoolGroup('Відхилені',    rejected, 'rejected'),
  ].join('') || '<div class="empty">Даних немає</div>');
}
window._adminRerender.school = _renderSchoolList;
function listenSchools() {
  onSnapshot(
    query(collection(db, 'schools'), orderBy('createdAt', 'desc')),
    snap => {
      if (!_schoolFirstSnap) {
        snap.docChanges().forEach(ch => {
          if (ch.type !== 'added') return;
          const d = ch.doc.data();
          if (d.status !== 'pending') return;
          showToast('Нова анкета школи!', `${d.name || 'Школа'} — ${d.phone || d.email || ''}`);
        });
      }
      _schoolFirstSnap = false;
      _schoolCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      _renderSchoolList();
    },
    err => { document.getElementById('schools-list').innerHTML = '<div class="empty">Помилка завантаження</div>'; console.error(err); }
  );
}

function renderSchoolGroup(label, list, status) {
  if (!list.length) return '';
  const cnt = status === 'pending' ? `<span class="admin-badge-cnt">${list.length}</span>` : `<span style="font-size:11px;color:var(--text-muted)">${list.length}</span>`;
  return `<div class="admin-header">${label} ${cnt}</div>${list.map(renderSchoolCard).join('')}`;
}

function renderSchoolCard(school) {
  const id = school.id;
  const ini = initials(school.name);
  const editing = _editingIds.school.has(id);
  const statusCls = school.status === 'approved' ? 'approved' : school.status === 'rejected' ? 'rejected' : 'pending';
  const statusLabel = { pending:'На розгляді', approved:'Активна', rejected:'Відхилено' }[school.status] || school.status;
  const branchList = Array.isArray(school.branches) ? school.branches : [];
  const branches = branchList.map(b => typeof b === 'string' ? b : (b.label||'')).filter(Boolean).join(', ') || '—';
  const created = school.createdAt?.toDate?.() ? school.createdAt.toDate().toLocaleDateString('uk-UA') : '—';

  const needsGeocode = branchList.some(b => typeof b === 'string' || (b && typeof b === 'object' && (!b.lat || !b.lng)));
  const branchesHtml = branchList.length
    ? branchList.map((b, i) => {
        const label = typeof b === 'string' ? b : (b.label || `Філія ${i+1}`);
        const hasPin = typeof b === 'object' && b.lat && b.lng;
        return `<div>
          <div class="admin-mp-row" style="font-size:11px;color:var(--text-muted)">
            <i class="ti ti-map-pin" style="font-size:10px;color:${hasPin?'var(--green)':'#c88'}"></i> ${esc(label)}
            ${hasPin ? `<span style="color:var(--text-hint)">${b.lat.toFixed(5)}, ${b.lng.toFixed(5)}</span>` : ''}
            ${!hasPin ? `<button type="button" class="admin-mp-toggle" style="margin:0" onclick="window._adminGeocodeSchoolBranch('${id}',${i})" id="am-sc-geo-${id}-${i}"><i class="ti ti-map-search"></i> Знайти на мапі</button>` : ''}

          </div>
          <div id="admin-branch-edit-${id}-${i}"></div>

    : '<span style="color:var(--text-hint);font-size:11px">—</span>';

  const logoShape = school.logoShape || 'square';
  const logoHtml = `<div class="admin-photos">
    <div style="text-align:center">
      ${school.logo ? `<img class="admin-photo" src="${esc(school.logo)}" alt="">` : `<div class="admin-photo" style="display:flex;align-items:center;justify-content:center;color:var(--text-hint)"><i class="ti ti-building-store"></i></div>`}

  const deleteBtn = `<button class="admin-btn delete" onclick="window._adminDeleteSchool('${id}','${esc((school.name||'').replace(/'/g,''))}')"><i class="ti ti-trash"></i> Видалити</button>`;
  const msgBtn = `<div class="admin-actions" style="margin-top:10px"><button class="admin-btn" style="background:var(--blue);color:#fff" onclick="window._adminStartChat('school','${id}','${esc((school.name||'').replace(/'/g,''))}','${esc((school.email||'').replace(/'/g,''))}')"><i class="ti ti-message-circle"></i> Написати</button></div>`;
  const actionsHtml = school.status === 'pending' ? `
    <div class="admin-actions">
      <button class="admin-btn approve" onclick="window._adminApproveSchool('${id}')"><i class="ti ti-check"></i> Підтвердити</button>
      <button class="admin-btn reject"  onclick="window._adminRejectSchool('${id}')"><i class="ti ti-x"></i> Відхилити</button>
    </div>
    <div class="admin-actions" style="margin-top:4px">${deleteBtn}</div>` : school.status === 'approved' ? `
    <div class="admin-actions">
      <button class="admin-btn reject" onclick="window._adminRejectSchool('${id}')"><i class="ti ti-ban"></i> Деактивувати</button>
    </div>
    <div class="admin-actions" style="margin-top:4px">${deleteBtn}</div>` : `
    <div class="admin-actions">
      <button class="admin-btn approve" onclick="window._adminApproveSchool('${id}')"><i class="ti ti-rotate-clockwise"></i> Відновити</button>
      ${deleteBtn}

  const fieldsHtml = editing
    ? SCHOOL_FIELDS.map(f => `<div class="admin-field"><div class="admin-field-label">${esc(f.label)}</div><div class="admin-field-val">${_editFieldHtml('school', id, f, school[f.key])}</div></div>`).join('')
      + `<div class="admin-actions">
           <button class="admin-btn approve" onclick="window._adminSaveSchool('${id}')"><i class="ti ti-device-floppy"></i> Зберегти поля</button>

    : `

        <div class="admin-field"><div class="admin-field-label">Телефон</div><div class="admin-field-val">${esc(school.phone||'—')}</div></div>
        <div class="admin-field"><div class="admin-field-label">Сайт</div><div class="admin-field-val">${school.website ? `<a href="${esc(school.website)}" target="_blank" style="color:#185fa5">${esc(school.website)}</a>` : '—'}</div></div>
        <div class="admin-field"><div class="admin-field-label">Ціна курсу</div><div class="admin-field-val">${school.price_course ? esc(school.price_course)+' грн' : '—'}</div></div>
        <div class="admin-field"><div class="admin-field-label">Ціна допзаняття</div><div class="admin-field-val">${school.price_extra ? esc(school.price_extra)+' грн/год' : '—'}</div></div>
        <div class="admin-field"><div class="admin-field-label">Опис</div><div class="admin-field-val" style="white-space:pre-line">${esc(school.about||'—')}</div></div>
        <button type="button" class="admin-edit-btn" onclick="event.stopPropagation();window._adminToggleEdit('school','${id}')"><i class="ti ti-pencil"></i> Редагувати поля</button>`;

  return `
    <div class="admin-card${editing?' open':''}" id="adm-school-${id}">
      <div class="admin-card-head" onclick="document.getElementById('adm-school-${id}').classList.toggle('open')">
        ${school.logo ? `<img class="admin-card-avatar" src="${esc(school.logo)}" alt="">` : `<div class="admin-card-avatar">${esc(ini)}</div>`}
        <div class="admin-card-main">
          <div class="admin-card-name">${esc(school.name||'—')}</div>
          <div class="admin-card-sub">${esc(school.phone||'')}${school.phone&&branches!=='—'?' · ':''}${esc(branches)}</div>
        </div>
        <span class="admin-status ${statusCls}">${statusLabel}</span>
        <i class="ti ti-chevron-down admin-card-arrow"></i>
      </div>
      <div class="admin-card-body">
        ${logoHtml}
        ${fieldsHtml}
        <div class="admin-field"><div class="admin-field-label">Райони / філії</div><div class="admin-field-val">${branchesHtml}
          ${needsGeocode ? `<button type="button" class="admin-mp-toggle" onclick="event.stopPropagation();window._adminGeocodeAllSchoolBranches('${id}')" id="am-sc-geo-all-${id}"><i class="ti ti-map-search"></i> Знайти всі на мапі</button>` : ''}
        </div></div>
        <div class="admin-field"><div class="admin-field-label">userId</div><div class="admin-field-val" style="font-size:10px;color:var(--text-hint);word-break:break-all">${esc(school.userId||'—')}</div></div>
        <div class="admin-field"><div class="admin-field-label">Дата</div><div class="admin-field-val">${esc(created)}</div></div>

}

// Геокодування старих філій без координат (раніше філії зберігались просто текстом
// району — тепер завжди {label,lat,lng} з мапи). Шукаємо назву через Nominatim і
// проставляємо шпильку автоматично, не чіпаючи вже коректні філії.
async function _adminGeocodeBranchText(text) {
  const r = await fetch(`${NOM_BASE}&limit=1&q=${encodeURIComponent(text)}`);
  const results = await r.json();
  if (!results.length) return null;
  const { lat, lon } = results[0];
  return { lat: +parseFloat(lat).toFixed(6), lng: +parseFloat(lon).toFixed(6) };
}
window._adminGeocodeSchoolBranch = async (schoolId, idx) => {
  const school = _schoolCache.find(s => s.id === schoolId);
  const branches = Array.isArray(school?.branches) ? [...school.branches] : [];
  const b = branches[idx];
  if (!b) return;
  const label = typeof b === 'string' ? b : (b.label || '');
  if (!label) return;
  const btn = document.getElementById(`am-sc-geo-${schoolId}-${idx}`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Пошук…'; }
  try {
    const ll = await _adminGeocodeBranchText(label);
    if (!ll) {
      showToast('Не знайдено', `«${label}» — спробуйте уточнити назву філії в кабінеті школи`);
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-map-search"></i> Знайти на мапі'; }
      return;
    }
    branches[idx] = { label, lat: ll.lat, lng: ll.lng };
    await updateDoc(doc(db, 'schools', schoolId), { branches });
    showToast('Шпильку знайдено', `${label} — ${ll.lat}, ${ll.lng}`);
  } catch (e) {
    alert('Помилка: ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-map-search"></i> Знайти на мапі'; }
  }
};
window._adminGeocodeAllSchoolBranches = async (schoolId) => {
  const school = _schoolCache.find(s => s.id === schoolId);
  const branches = Array.isArray(school?.branches) ? [...school.branches] : [];
  const pendingIdx = branches.map((b, i) => (typeof b === 'string' || (b && typeof b === 'object' && (!b.lat || !b.lng))) ? i : -1).filter(i => i >= 0);
  if (!pendingIdx.length) return;
  const allBtn = document.getElementById(`am-sc-geo-all-${schoolId}`);
  if (allBtn) { allBtn.disabled = true; allBtn.innerHTML = '<i class="ti ti-loader"></i> Пошук…'; }
  let found = 0, missed = [];
  for (const idx of pendingIdx) {
    const b = branches[idx];
    const label = typeof b === 'string' ? b : (b.label || '');
    if (!label) continue;
    const btn = document.getElementById(`am-sc-geo-${schoolId}-${idx}`);
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Пошук…'; }
    try {
      const ll = await _adminGeocodeBranchText(label);
      if (ll) { branches[idx] = { label, lat: ll.lat, lng: ll.lng }; found++; }
      else { missed.push(label); if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ti ti-map-search"></i> Знайти на мапі'; } }
    } catch (e) { missed.push(label); }
    // Nominatim (публічний сервер) дозволяє не більше 1 запиту/сек
    await new Promise(res => setTimeout(res, 1100));
  }
  if (found) {
    try { await updateDoc(doc(db, 'schools', schoolId), { branches }); }
    catch (e) { alert('Помилка збереження: ' + (e.message || e)); }
  }
  showToast(
    found ? `Знайдено шпильок: ${found}` : 'Нічого не знайдено',
    missed.length ? `Не вдалось: ${missed.join(', ')}` : ''
  );
  if (allBtn) { allBtn.disabled = false; allBtn.innerHTML = '<i class="ti ti-map-search"></i> Знайти всі на мапі'; }
};

// ===== ПОВІДОМЛЕННЯ (admin <-> учень/інструктор/школа) =====
// Окрема колекція від чату учень<->інструктор — щоб не змішувати схеми
// (adminChats/{role}_{refId}, refId = uid учня / id інструктора / id школи).
let _adminChatCache = [];
let _currentAdminChatId = null;
let _unsubAdminChatMsgs = null;
const _ROLE_LABEL = { student: 'Учень', instructor: 'Інструктор', school: 'Школа' };

function listenAdminChats() {
  onSnapshot(query(collection(db, 'adminChats'), orderBy('lastAt', 'desc')), snap => {
    _adminChatCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const totalUnread = _adminChatCache.reduce((s, c) => s + (c.unreadByAdmin || 0), 0);
    const badge = document.getElementById('count-badge-messages');
    if (totalUnread) { badge.textContent = totalUnread; badge.style.display = ''; } else { badge.style.display = 'none'; }
    _renderMessagesList();
  }, err => { document.getElementById('messages-list').innerHTML = '<div class="empty">Помилка завантаження</div>'; console.error(err); });
}
function _renderMessagesList() {
  const list = document.getElementById('messages-list');
  if (!_adminChatCache.length) { list.innerHTML = '<div class="empty">Ще немає жодного повідомлення. Напишіть комусь із вкладок "Інструктори", "Учні" чи "Школи" — кнопка "Написати" в картці.</div>'; return; }
  list.innerHTML = _adminChatCache.map(c => `
    <div class="admin-msg-thread" onclick="window._openAdminChat('${c.id}')">
      <span class="admin-msg-role ${c.role}">${esc(_ROLE_LABEL[c.role]||c.role)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(c.name||'—')}</div>
        <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.lastMessage||'Немає повідомлень')}</div>
      </div>
      ${c.unreadByAdmin ? `<span class="admin-msg-unread">${c.unreadByAdmin}</span>` : ''}
    </div>`).join('');
}

// entity: 'instructor'|'school'|'student'; refId: instr.id / school.id / user.uid
window._adminStartChat = async (role, refId, name, email) => {
  const chatId = `${role}_${refId}`;
  try {
    await setDoc(doc(db, 'adminChats', chatId), {
      role, refId, name: name || '', email: email || '',
      unreadByAdmin: 0,
    }, { merge: true });
    window._adminSwitchAndOpenChat(chatId);
  } catch (e) { alert('Помилка: ' + (e.message || e)); }
};
window._adminSwitchAndOpenChat = (chatId) => {
  window._switchTab('messages');
  window._openAdminChat(chatId);
};
window._openAdminChat = (chatId) => {
  const chat = _adminChatCache.find(c => c.id === chatId) || { id: chatId };
  _currentAdminChatId = chatId;
  document.getElementById('admin-chat-title').textContent = chat.name || 'Повідомлення';
  document.getElementById('admin-chat-sub').textContent = _ROLE_LABEL[chat.role] || '';
  document.getElementById('admin-chat-modal').style.display = 'flex';
  if (chat.unreadByAdmin) updateDoc(doc(db, 'adminChats', chatId), { unreadByAdmin: 0 }).catch(() => {});
  if (_unsubAdminChatMsgs) { _unsubAdminChatMsgs(); _unsubAdminChatMsgs = null; }
  const el = document.getElementById('admin-chat-messages');
  el.innerHTML = '<div class="empty"><i class="ti ti-loader"></i></div>';
  _unsubAdminChatMsgs = onSnapshot(
    query(collection(db, 'adminChats', chatId, 'messages'), orderBy('at', 'asc')),
    msnap => {
      if (!msnap.size) { el.innerHTML = '<div class="empty" style="color:var(--text-muted)">Напишіть перше повідомлення</div>'; return; }
      el.innerHTML = msnap.docs.map(d => {
        const m = d.data();
        const mine = m.from === 'admin';
        const t = m.at?.toDate?.();
        const ts = t ? `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : '';
        return `<div class="admin-chat-msg ${mine?'mine':'theirs'}">${esc(m.text)}<div class="admin-chat-msg-time">${ts}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    },
    () => {}
  );
};
window._closeAdminChat = () => {
  document.getElementById('admin-chat-modal').style.display = 'none';
  if (_unsubAdminChatMsgs) { _unsubAdminChatMsgs(); _unsubAdminChatMsgs = null; }
  _currentAdminChatId = null;
};
window._adminSendChat = async () => {
  const input = document.getElementById('admin-chat-input');
  const text = (input?.value || '').trim();
  if (!text || !_currentAdminChatId) return;
  input.value = '';
  const chatId = _currentAdminChatId;
  try {
    await Promise.all([
      addDoc(collection(db, 'adminChats', chatId, 'messages'), { text, from: 'admin', senderName: 'Адміністрація', at: serverTimestamp() }),
      setDoc(doc(db, 'adminChats', chatId), { lastMessage: text, lastAt: serverTimestamp(), unreadByUser: increment(1) }, { merge: true }),
    ]);
  } catch (e) { alert('Помилка: ' + (e.message || e)); input.value = text; }
};

function _renderUserList() {
  const users = _sortEntities(_userCache, _sortState.user, 'name');
  const list = document.getElementById('users-list');
  list.innerHTML = users.length ? `
    ${_sortBarHtml('user')}
    <div class="admin-header">Учні <span style="font-size:11px;color:var(--text-muted)">${users.length}</span></div>
    ${users.map(_renderUserCard).join('')}` : '<div class="empty">Учнів ще немає</div>';
}
window._adminRerender.user = _renderUserList;
window._adminSaveUser = async (id) => {
  const vals = _collectEditValues('user', id, USER_FIELDS);
  try {
    await updateDoc(doc(db, 'users', id), vals);
    _editingIds.user.delete(id);
    showToast('Збережено', 'Дані учня оновлено');
  } catch (e) { alert('Помилка: ' + (e.message || e)); }
};
let _userFirstSnap = true;
function listenUsers() {
  // без orderBy('createdAt') — Firestore виключає документи без цього поля (напр. вхід через Google)
  onSnapshot(collection(db, 'users'), snap => {
    if (!_userFirstSnap) {
      snap.docChanges().forEach(ch => {
        if (ch.type !== 'added') return;
        const d = ch.doc.data();
        if (d.email === ADMIN_EMAIL) return;
        showToast('Новий учень зареєструвався!', d.name || d.email || '');
      });
    }
    _userFirstSnap = false;
    _userCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    _renderUserList();
  }, err => { document.getElementById('users-list').innerHTML = '<div class="empty">Помилка завантаження</div>'; console.error(err); });
}

window._adminDeleteUser = async (id, name) => {
  if (!confirm(`Видалити учня «${name}»? Дію не можна скасувати.`)) return;
  try { await deleteDoc(doc(db, 'users', id)); }
  catch(e) { alert('Помилка: ' + (e.message||e)); }
};

// ===== ЗАПИСИ =====
function listenBookings() {
  onSnapshot(
    query(collection(db, 'bookings'), orderBy('createdAt', 'desc')),
    snap => {
      const bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const list = document.getElementById('bookings-list');
      if (!bookings.length) { list.innerHTML = '<div class="empty">Записів ще немає</div>'; return; }
      const cnt = `<span style="font-size:11px;color:var(--text-muted)">${bookings.length}</span>`;
      list.innerHTML = `<div class="admin-header">Усі записи ${cnt}</div>` + bookings.map(b => {
        const dateStr = bkDateStr(b);
        const mpLbl = b.meetingPoint?.label || '';
        return `<div class="admin-card" id="adm-bk-${b.id}">
          <div class="admin-card-head" onclick="document.getElementById('adm-bk-${b.id}').classList.toggle('open')">
            <div class="admin-card-avatar"><i class="ti ti-calendar-event"></i></div>
            <div class="admin-card-main">
              <div class="admin-card-name">${esc(b.clientName||b.clientEmail||'Учень')} → ${esc(b.instructorName||'Інструктор')}</div>
              <div class="admin-card-sub">${esc(dateStr)} о ${esc(b.time||'')} · ${b.duration||60} хв</div>
            </div>
            ${bkStatusBadge(b.status)}
            <i class="ti ti-chevron-down admin-card-arrow"></i>
          </div>
          <div class="admin-card-body">
            <div class="admin-field"><div class="admin-field-label">Учень</div><div class="admin-field-val">${esc(b.clientName||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Тел. учня</div><div class="admin-field-val">${esc(b.clientPhone||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Email учня</div><div class="admin-field-val">${esc(b.clientEmail||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Інструктор</div><div class="admin-field-val">${esc(b.instructorName||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Тел. інструктора</div><div class="admin-field-val">${esc(b.instructorPhone||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Дата/час</div><div class="admin-field-val">${esc(dateStr)} о ${esc(b.time||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Тривалість</div><div class="admin-field-val">${b.duration||60} хв</div></div>
            <div class="admin-field"><div class="admin-field-label">Місце зустрічі</div><div class="admin-field-val">${esc(mpLbl||'—')}</div></div>
            <div class="admin-field"><div class="admin-field-label">Статус</div><div class="admin-field-val">${bkStatusBadge(b.status)}</div></div>
          </div>
        </div>`;
      }).join('');
    },
    err => { document.getElementById('bookings-list').innerHTML = '<div class="empty">Помилка завантаження</div>'; console.error(err); }
  );
}

// ===== ПРОБЛЕМИ =====
function listenProblems() {
  onSnapshot(
    query(collection(db, 'problems'), orderBy('createdAt', 'desc')),
    snap => {
      const list  = document.getElementById('problems-list');
      const badge = document.getElementById('count-badge-problems');
      const newCount = snap.docs.filter(d => d.data().status !== 'resolved').length;
      if (snap.empty) {
        list.innerHTML = '<div class="empty">🎉 Звернень немає</div>';
        badge.style.display = 'none';
        return;
      }
      if (newCount > 0) { badge.textContent = newCount + ' нових'; badge.style.display = ''; }
      else badge.style.display = 'none';
      list.innerHTML = snap.docs.map(renderProblemCard).join('');
    },
    err => {
      document.getElementById('problems-list').innerHTML = '<div class="empty">Не вдалось завантажити звернення</div>';
      console.error('listenProblems error:', err.message);
    }
  );
}

function renderProblemCard(d) {
  const p = d.data();
  const resolved = p.status === 'resolved';
  const dateStr = p.createdAt?.toDate?.().toLocaleString('uk-UA', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' }) || '—';
  return `<div class="problem-card${resolved ? ' resolved' : ''}" id="p-${d.id}">
    <div class="problem-text">${esc(p.text)}</div>
    <div class="problem-meta">
      ${p.contact ? `<span>📞 ${esc(p.contact)}</span>` : ''}
      ${p.userEmail ? `<span>✉️ ${esc(p.userEmail)}</span>` : ''}
      <span>${dateStr}</span>
      ${resolved ? '<span>· вирішено</span>' : ''}
    </div>
    <div class="problem-actions">
      ${resolved
        ? `<button class="btn-reject" onclick="window._reopenProblem('${d.id}')">↺ Повернути</button>`
        : `<button class="btn-approve" onclick="window._resolveProblem('${d.id}')">✓ Вирішено</button>`}
      <button class="btn-reject" onclick="window._deleteProblem('${d.id}')">✗ Видалити</button>
    </div>
  </div>`;
}

window._resolveProblem = async id => { await updateDoc(doc(db, 'problems', id), { status: 'resolved' }); };
window._reopenProblem  = async id => { await updateDoc(doc(db, 'problems', id), { status: 'new' }); };
window._deleteProblem  = async id => {
  if (confirm('Видалити це звернення?')) await deleteDoc(doc(db, 'problems', id));
};
</script>
