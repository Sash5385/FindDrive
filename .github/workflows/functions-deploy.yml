name: Deploy Cloud Functions

# Деплоїть functions/ при пуші в main (лише коли змінились файли функцій) або
# вручну через "Run workflow". Використовує той самий секрет FIREBASE_TOKEN,
# що й firestore-rules-deploy.yml (Settings → Secrets and variables → Actions).
on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm install
        working-directory: functions

      # --force: у неінтерактивному CI firebase-tools відмовляється видаляти
      # функції, яких немає в поточному коді (щоб не зробити цього випадково) —
      # --force дозволяє прибрати справді застарілі функції автоматично.
      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --force --token "${{ secrets.FIREBASE_TOKEN }}"
