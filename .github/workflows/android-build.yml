name: Android build (TWA)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "appVersionCode (збільшувати з кожним завантаженням у Play)"
        required: true
        default: "1"
      track:
        description: "Куди завантажити в Google Play (none — лише зібрати артефакт)"
        type: choice
        default: none
        options: [none, internal, alpha, beta, production]
      release_status:
        description: "Статус релізу в Play (draft — розгортання підтверджує власник у Console)"
        type: choice
        default: draft
        options: [draft, completed]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"; ls "$SDK" "$SDK/cmdline-tools" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          mkdir -p ~/.bubblewrap
          # Bubblewrap очікує класичну структуру SDK з каталогом tools/ — збираємо її симлінками на SDK раннера
          BW_SDK="$HOME/bw-android-sdk"; mkdir -p "$BW_SDK"
          for d in build-tools platforms platform-tools licenses cmdline-tools; do [ -e "$SDK/$d" ] && ln -sfn "$SDK/$d" "$BW_SDK/$d"; done
          ln -sfn "$SDK/cmdline-tools/latest" "$BW_SDK/tools"
          export ANDROID_HOME="$BW_SDK" ANDROID_SDK_ROOT="$BW_SDK"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$BW_SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
      - name: Build AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload.keystore
          VC=${{ inputs.version_code }}
          sed -i "s/\"appVersionCode\": [0-9]*/\"appVersionCode\": $VC/; s/\"appVersion\": \"[^\"]*\"/\"appVersion\": \"$VC\"/" twa-manifest.json
          unset ANDROID_SDK_ROOT  # Gradle не терпить двох різних шляхів до SDK
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=twa-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: finddrive-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
      - name: Upload to Google Play
        if: ${{ inputs.track != 'none' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ua.in.finddrive.app
          releaseFiles: android/app-release-bundle.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
