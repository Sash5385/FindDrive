name: Firestore rules tests

# Тести firestore.rules в емуляторі на кожен PR/пуш, що чіпає правила.
on:
  pull_request:
    paths: ['firestore.rules', 'tests/rules/**']
  push:
    branches: ['claude/**']
    paths: ['firestore.rules', 'tests/rules/**']
  workflow_dispatch:

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: tests/rules
      - run: npm test
        working-directory: tests/rules
